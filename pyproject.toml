[project]
name = "speclens"
version = "0.1.0"
description = "Grounded, citable answers about API specifications, for LLMs and for people."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["openapi", "json-schema", "api", "llm", "rag", "mcp", "grounding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Repository = "https://github.com/blashkar/speclens"

[project.scripts]
speclens = "speclens.cli:main"
speclens-mcp = "speclens.mcp_server:main"

[project.optional-dependencies]
mcp = [
    "mcp>=2.3,<3",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speclens"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "tools/", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
