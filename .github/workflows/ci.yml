name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra mcp
      - name: Test
        run: uv run pytest -q
      - name: Validate the fixture spec
        run: uv run speclens validate tests/fixtures/openapi-starter/openapi.yaml
      - name: Cross-check the fixture spec
        run: uv run python tools/crosscheck.py tests/fixtures/openapi-starter/openapi.yaml
      - name: Build the package and run it from the wheel
        run: |
          uv build
          uvx --from "$(ls dist/*.whl)" speclens validate tests/fixtures/openapi-starter/openapi.yaml
